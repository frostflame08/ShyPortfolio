    <script>
        const typingLines = document.querySelectorAll('.typing-text');

        typingLines.forEach((line, lineIndex) => {
            const message = line.textContent.trim();
            let characterIndex = 0;
            let deleting = false;

            const typeLoop = () => {
                line.textContent = message.slice(0, characterIndex);

                if (!deleting && characterIndex < message.length) {
                    characterIndex += 1;
                    setTimeout(typeLoop, 55);
                    return;
                }

                if (!deleting) {
                    deleting = true;
                    setTimeout(typeLoop, 1800 + lineIndex * 400);
                    return;
                }

                if (characterIndex > 0) {
                    characterIndex -= 1;
                    setTimeout(typeLoop, 30);
                    return;
                }

                deleting = false;
                setTimeout(typeLoop, 500);
            };

            setTimeout(typeLoop, lineIndex * 700);
        });
    </script>
